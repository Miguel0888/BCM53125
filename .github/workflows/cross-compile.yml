name: Cross-compile and release MIPS32 BE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MIPS cross-compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-mips-linux-gnu binutils-mips-linux-gnu qemu-user file

      - name: Cross-compile static MIPS32 big-endian binary
        run: make

      - name: Verify ELF target and static linking
        shell: bash
        run: |
          set -euo pipefail
          file dist/switchmirror
          readelf -h dist/switchmirror
          readelf -h dist/switchmirror | grep -Eq 'Class:.*ELF32'
          readelf -h dist/switchmirror | grep -Eq 'Data:.*big endian'
          readelf -h dist/switchmirror | grep -Eq 'Machine:.*MIPS'
          if readelf -l dist/switchmirror | grep -q INTERP; then
            echo 'Unexpected dynamic interpreter' >&2
            exit 1
          fi

      - name: Smoke-test CLI with QEMU MIPS
        run: make smoke

      - name: Package executable and checksum
        run: |
          cp dist/switchmirror dist/switchmirror-mips32-be
          cd dist
          sha256sum switchmirror-mips32-be > SHA256SUMS

      - name: Upload workflow artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: switchmirror-mips32-be
          path: |
            dist/switchmirror-mips32-be
            dist/SHA256SUMS
            README.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish download in GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            title="BCM53125 ${tag}"
            prerelease_args=()
          else
            tag="v0.1.0-alpha.${GITHUB_RUN_NUMBER}"
            title="BCM53125 development build ${GITHUB_RUN_NUMBER}"
            prerelease_args=(--prerelease)
          fi
          gh release create "${tag}" \
            dist/switchmirror-mips32-be \
            dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes "Experimental static MIPS32 big-endian router binary built from commit ${GITHUB_SHA}. Untested on actual RT-N66U hardware. Run 'probe' first. SHA256SUMS included." \
            "${prerelease_args[@]}"
          echo "Release URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "${GITHUB_STEP_SUMMARY}"
